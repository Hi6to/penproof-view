<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PenProof 制作過程レポート</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1f2320;
    --sub: #6b7268;
    --line: #e4e1da;
    --accent: #2f6f4f;
    --accent-bg: #eaf3ee;
    --warn: #9a6b1f;
    --warn-bg: #fbf1e0;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --s5: #e87ba4;
    --s6: #008300;
    --chart-grid: #e1e0d9;
    --chart-muted: #898781;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header.page { text-align: center; padding: 24px 0 8px; }
  header.page .brand { font-size: 13px; letter-spacing: .08em; color: var(--sub); text-transform: uppercase; }
  header.page h1 { font-size: 22px; margin: 6px 0 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px;
    margin-top: 16px;
  }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
  .facts dt { color: var(--sub); white-space: nowrap; }
  .facts dd { margin: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--accent-bg); color: var(--accent); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .note {
    font-size: 13px;
    color: var(--sub);
    background: #fafaf8;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 16px;
  }
  h2.section { font-size: 15px; margin: 28px 0 10px; color: var(--sub); font-weight: 600; }
  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .entry {
    display: flex;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    align-items: center;
  }
  .entry .thumb {
    width: 88px; height: 88px; flex: none;
    border-radius: 8px;
    background: #eee;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-size: 22px;
  }
  .entry .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .entry .thumb.private { background: #f1efe9; color: #b9ab7f; }
  .entry .meta { flex: 1; min-width: 0; }
  .entry .meta .reason { font-size: 13.5px; font-weight: 600; }
  .entry .meta .time { font-size: 12px; color: var(--sub); }
  .entry .meta .hash { font-size: 11px; color: var(--sub); font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; margin-top: 2px; }
  footer.page { text-align: center; font-size: 12px; color: var(--sub); margin-top: 40px; }
  .msg { text-align: center; padding: 60px 16px; color: var(--sub); }
  .chart-wrap { position: relative; }
  .chart-svg { width: 100%; height: auto; display: block; touch-action: none; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: 12.5px; }
  .chart-legend .item { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .chart-legend .swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }
  .chart-legend .num { color: var(--sub); }
  .chart-tooltip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--ink); color: #fff; font-size: 12px; line-height: 1.55;
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    transform: translate(-50%, -100%); white-space: nowrap; opacity: 0; transition: opacity .1s;
  }
  .chart-tooltip.show { opacity: 1; }
  .chart-tooltip .row { display: flex; align-items: center; gap: 6px; }
  .chart-tooltip .row .k { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chart-tooltip .row .v { font-weight: 600; margin-left: auto; padding-left: 10px; }
  .chart-tooltip .time { color: #cfcfc9; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="brand">PenProof</div>
    <h1>制作過程レポート</h1>
  </header>
  <div id="app">
    <div class="msg">読み込んでいます...</div>
  </div>
  <footer class="page">
    このページは、記録された事実だけを表示しています。人が描いたか AI が描いたかの判定はしていません。<br>
    内容は、記録した本人が選んだ範囲までです。判断は、ご自身でお願いします。
  </footer>
</div>
<script>
(function () {
  var cfg = window.PENPROOF_CONFIG || {};
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    if (!iso) return "(不明)";
    try {
      var d = new Date(iso);
      return d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  function fmtDuration(startIso, endIso) {
    if (!startIso || !endIso) return "(不明)";
    var ms = new Date(endIso) - new Date(startIso);
    if (!(ms > 0)) return "(不明)";
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h > 0 ? h + " 時間 " + m + " 分" : m + " 分";
  }

  var REASON_LABEL = {
    start: "記録の開始",
    end: "記録の終了",
    interval: "経過(定期)",
    no_pen_change: "変化(ペン入力なし)",
    view_unknown: "大きな変化(原因不明)",
  };

  // 1秒ごとの記録(ticks.csv)の label を、グラフ用にまとめた6分類。
  // pen_reports/pen_contact/wheel の「数値」はOSから来る生の値そのものだが、
  // ここでの「分類(色)」は画面の変化を見て判定するプログラム独自のロジック。
  var TICK_CATEGORIES = [
    { id: "pen",     label: "ペンでの描画",             css: "--s1" },
    { id: "view",    label: "表示操作(拡大・回転など)", css: "--s2" },
    { id: "no_pen",  label: "ペン入力なしの変化",        css: "--s3" },
    { id: "unknown", label: "原因不明の変化",            css: "--s4" },
    { id: "small",   label: "ほとんど変化なし",          css: "--s5" },
    { id: "idle",    label: "記録できない時間",          css: "--s6" },
  ];

  function tickCategoryOf(label) {
    switch (label) {
      case "pen_draw": case "pen_large": return "pen";
      case "view": return "view";
      case "no_pen_change": return "no_pen";
      case "view_unknown": return "unknown";
      case "small_change": case "none": return "small";
      case "paused": case "settling": return "idle";
      default: return null; // 将来ラベルが増えても、無視するだけで壊れないように
    }
  }

  function parseTicksCsv(text) {
    var out = [];
    var lines = text.split("\n");
    for (var i = 1; i < lines.length; i++) { // 先頭行はヘッダーなので飛ばす
      var line = lines[i];
      if (!line) continue;
      var c1 = line.indexOf(",");
      if (c1 < 0) continue;
      var tMs = parseInt(line.slice(0, c1), 10);
      if (!isFinite(tMs)) continue;
      var rest = line.slice(c1 + 1);
      var c2 = rest.indexOf(",");
      var label = c2 < 0 ? rest : rest.slice(0, c2);
      out.push({ tMs: tMs, label: label });
    }
    return out;
  }

  function niceBucketSeconds(durationSec) {
    var candidates = [60, 120, 300, 600, 900, 1800, 3600, 7200];
    var maxBuckets = 180; // グラフが重くなりすぎないように、区間の数の上限を決めておく
    for (var i = 0; i < candidates.length; i++) {
      if (durationSec / candidates[i] <= maxBuckets) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  function buildTickBuckets(ticks, bucketSec) {
    if (ticks.length === 0) return null;
    var t0 = ticks[0].tMs;
    var tLast = ticks[ticks.length - 1].tMs;
    var bucketMs = bucketSec * 1000;
    var n = Math.max(1, Math.floor((tLast - t0) / bucketMs) + 1);
    var counts = {};
    TICK_CATEGORIES.forEach(function (c) { counts[c.id] = new Array(n).fill(0); });
    ticks.forEach(function (t) {
      var cat = tickCategoryOf(t.label);
      if (!cat) return;
      var idx = Math.floor((t.tMs - t0) / bucketMs);
      if (idx < 0) idx = 0;
      if (idx >= n) idx = n - 1;
      counts[cat][idx]++;
    });
    return { t0: t0, bucketSec: bucketSec, n: n, counts: counts };
  }

  function fmtElapsed(sec) {
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return h + ":" + (m < 10 ? "0" : "") + m;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    var steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 7200];
    for (var i = 0; i < steps.length; i++) { if (steps[i] >= v) return steps[i]; }
    return Math.ceil(v / 1000) * 1000;
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function renderTickChart(root, buckets) {
    var W = 640, H = 220, padL = 34, padR = 8, padT = 10, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = buckets.n;

    var maxV = 0;
    TICK_CATEGORIES.forEach(function (c) {
      buckets.counts[c.id].forEach(function (v) { if (v > maxV) maxV = v; });
    });
    var yMax = niceMax(maxV);

    function xAt(i) { return padL + (n <= 1 ? plotW / 2 : (i + 0.5) / n * plotW); }
    function yAt(v) { return padT + plotH - (v / yMax) * plotH; }

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "chart-svg", role: "img", "aria-label": "作業の推移グラフ" });

    [0, 0.5, 1].forEach(function (f) {
      var v = yMax * f;
      var y = yAt(v);
      svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: y, y2: y, stroke: "var(--chart-grid)", "stroke-width": 1 }));
      var t = svgEl("text", { x: padL - 6, y: y + 3, "text-anchor": "end", "font-size": 10, fill: "var(--chart-muted)" });
      t.textContent = Math.round(v);
      svg.appendChild(t);
    });

    var xTickCount = Math.min(6, n);
    for (var k = 0; k < xTickCount; k++) {
      var idx = Math.round(k / Math.max(1, xTickCount - 1) * (n - 1));
      var elapsedSec = (idx + 0.5) * buckets.bucketSec;
      var t2 = svgEl("text", { x: xAt(idx), y: H - padB + 14, "text-anchor": "middle", "font-size": 10, fill: "var(--chart-muted)" });
      t2.textContent = fmtElapsed(elapsedSec);
      svg.appendChild(t2);
    }

    TICK_CATEGORIES.forEach(function (c) {
      var arr = buckets.counts[c.id];
      var total = arr.reduce(function (a, b) { return a + b; }, 0);
      if (total === 0) return;
      var pts = [];
      for (var i = 0; i < n; i++) pts.push(xAt(i) + "," + yAt(arr[i]));
      svg.appendChild(svgEl("polyline", {
        points: pts.join(" "), fill: "none",
        stroke: "var(" + c.css + ")", "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
      }));
      svg.appendChild(svgEl("circle", {
        cx: xAt(n - 1), cy: yAt(arr[n - 1]), r: 4,
        fill: "var(" + c.css + ")", stroke: "var(--card)", "stroke-width": 2,
      }));
    });

    var crosshair = svgEl("line", { x1: 0, x2: 0, y1: padT, y2: H - padB, stroke: "var(--chart-muted)", "stroke-width": 1, "stroke-dasharray": "3,3", opacity: 0 });
    svg.appendChild(crosshair);
    var hitRect = svgEl("rect", { x: padL, y: padT, width: plotW, height: plotH, fill: "transparent" });
    svg.appendChild(hitRect);

    root.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "chart-wrap";
    wrap.appendChild(svg);
    var tooltip = document.createElement("div");
    tooltip.className = "chart-tooltip";
    wrap.appendChild(tooltip);
    root.appendChild(wrap);

    function handleMove(clientX) {
      var box = svg.getBoundingClientRect();
      var relX = clientX - box.left;
      var plotLeftPx = (padL / W) * box.width;
      var plotWidthPx = (plotW / W) * box.width;
      var frac = Math.min(1, Math.max(0, (relX - plotLeftPx) / plotWidthPx));
      var idx = Math.min(n - 1, Math.max(0, Math.floor(frac * n)));

      crosshair.setAttribute("x1", xAt(idx));
      crosshair.setAttribute("x2", xAt(idx));
      crosshair.setAttribute("opacity", 1);

      var startSec = idx * buckets.bucketSec;
      var endSec = startSec + buckets.bucketSec;
      var rows = "";
      TICK_CATEGORIES.forEach(function (c) {
        var v = buckets.counts[c.id][idx];
        rows += '<div class="row"><span class="k" style="background:var(' + c.css + ')"></span>'
          + esc(c.label) + '<span class="v">' + v + "</span></div>";
      });
      tooltip.innerHTML = '<div class="time">' + fmtElapsed(startSec) + " 〜 " + fmtElapsed(endSec) + "</div>" + rows;
      tooltip.classList.add("show");
      tooltip.style.left = ((xAt(idx) / W) * box.width) + "px";
      tooltip.style.top = Math.max(0, (padT / H) * box.height - 8) + "px";
    }

    svg.addEventListener("pointermove", function (ev) { handleMove(ev.clientX); });
    svg.addEventListener("pointerleave", function () {
      crosshair.setAttribute("opacity", 0);
      tooltip.classList.remove("show");
    });

    var legend = document.createElement("div");
    legend.className = "chart-legend";
    TICK_CATEGORIES.forEach(function (c) {
      var total = buckets.counts[c.id].reduce(function (a, b) { return a + b; }, 0);
      if (total === 0) return;
      var item = document.createElement("div");
      item.className = "item";
      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = "var(" + c.css + ")";
      item.appendChild(sw);
      item.appendChild(document.createTextNode(c.label));
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = "(" + total + " 回)";
      item.appendChild(num);
      legend.appendChild(item);
    });
    root.appendChild(legend);

    var note = document.createElement("div");
    note.className = "note";
    note.style.marginTop = "10px";
    note.textContent = "色分けは、1秒ごとの記録をソフトウェアが自動で分類したものです(人が描いたかどうかの判定ではありません)。"
      + "縦軸の数値は、横軸の1目盛りの区間内に、その分類が何秒(何回)あったかを表す、OS由来の生の記録です。";
    root.appendChild(note);
  }

  function loadTicksChart(cfg, linkId) {
    var section = document.getElementById("ticksSection");
    var root = document.getElementById("ticksRoot");
    if (!section || !root) return;
    fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/get_public_ticks", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: cfg.SUPABASE_ANON_KEY,
        Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ p_link_id: linkId }),
    })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (text) {
        if (!text || typeof text !== "string") { section.remove(); return; }
        var ticks = parseTicksCsv(text);
        if (ticks.length < 2) { section.remove(); return; }
        var durationSec = (ticks[ticks.length - 1].tMs - ticks[0].tMs) / 1000;
        var bucketSec = niceBucketSeconds(durationSec);
        var buckets = buildTickBuckets(ticks, bucketSec);
        if (!buckets) { section.remove(); return; }
        renderTickChart(root, buckets);
      })
      .catch(function () { section.remove(); }); // 古い作品(この関数を追加する前に公開)や、未実行のSQLでも壊れないように
  }

  function showMessage(text) {
    app.innerHTML = '<div class="msg">' + esc(text) + "</div>";
  }

  function render(work, chain, images) {
    var imageByEntry = {};
    (images || []).forEach(function (im) { imageByEntry[im.chain_entry_id] = im; });

    var verified = work.target_verified === true;
    var appName = work.target_app || "(不明)";

    var html = "";
    html += '<div class="card"><dl class="facts">';
    html += "<dt>記録対象</dt><dd>" + esc(appName) + " "
      + (verified
        ? '<span class="badge ok">CLIP STUDIO PAINT を確認</span>'
        : '<span class="badge warn">未確認</span>')
      + "</dd>";
    html += "<dt>開始</dt><dd>" + esc(fmtDate(work.started_at)) + "</dd>";
    html += "<dt>終了</dt><dd>" + esc(fmtDate(work.ended_at)) + "</dd>";
    html += "<dt>制作時間</dt><dd>" + esc(fmtDuration(work.started_at, work.ended_at)) + "</dd>";
    html += "</dl></div>";

    html += '<div class="note">'
      + "「記録対象」は、PenProof が記録した画面が実際に CLIP STUDIO PAINT のものだったかどうかの確認結果です。"
      + "「変化(ペン入力なし)」「大きな変化(原因不明)」は、ペンでの入力を伴わずに画面が変わった箇所です"
      + "(画像の貼り付け・塗りつぶしなど、様々な理由がありえます)。これらは必ずこの記録に含まれます。"
      + "</div>";

    html += '<div id="ticksSection">';
    html += '<h2 class="section">作業の推移</h2>';
    html += '<div class="card" id="ticksRoot"><div class="msg" style="padding:20px 0;">グラフを読み込んでいます…</div></div>';
    html += "</div>";

    var entries = (chain || [])
      .filter(function (c) { return c.reason !== "ticks_hash"; })
      .sort(function (a, b) { return a.seq - b.seq; });

    html += '<h2 class="section">記録された出来事(' + entries.length + " 件)</h2>";
    html += '<div class="timeline">';
    entries.forEach(function (c) {
      var img = imageByEntry[c.id];
      var label = REASON_LABEL[c.reason] || c.reason;
      html += '<div class="entry">';
      if (img) {
        html += '<div class="thumb loading" data-storage-path="' + esc(img.storage_path) + '">…</div>';
      } else {
        html += '<div class="thumb private">🔒</div>';
      }
      html += '<div class="meta">';
      html += '<div class="reason">' + esc(label) + "</div>";
      html += '<div class="time">seq ' + esc(c.seq) + "</div>";
      html += '<div class="hash">' + esc(c.image_hash) + "</div>";
      html += "</div></div>";
    });
    html += "</div>";

    app.innerHTML = html;
    loadThumbnails();
    loadTicksChart(cfg, id);
  }

  // ストレージは非公開バケットなので、通常の <img src> では読めない(認証ヘッダーが要る)。
  // ひとつずつ取ってきて、blob の URL に差し替える(公開状態でなくなった画像は、失敗してそのまま非表示扱いになる)。
  function loadThumbnails() {
    var nodes = document.querySelectorAll(".thumb.loading");
    nodes.forEach(function (node) {
      var path = node.getAttribute("data-storage-path");
      fetch(cfg.SUPABASE_URL + "/storage/v1/object/published-images/" + path, {
        headers: {
          apikey: cfg.SUPABASE_ANON_KEY,
          Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY,
        },
      })
        .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.blob(); })
        .then(function (blob) {
          var img = document.createElement("img");
          img.src = URL.createObjectURL(blob);
          img.alt = "";
          node.classList.remove("loading");
          node.textContent = "";
          node.appendChild(img);
        })
        .catch(function () {
          node.classList.remove("loading");
          node.classList.add("private");
          node.textContent = "🔒";
        });
    });
  }

  var params = new URLSearchParams(location.search);
  var id = params.get("id");

  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_URL.indexOf("xxxx") >= 0) {
    showMessage("ページの設定がまだ済んでいません(config.js)。");
    return;
  }
  if (!id) {
    showMessage("作品の ID が指定されていません。QR コードか、正しい URL から開いてください。");
    return;
  }

  fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/get_public_work", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: cfg.SUPABASE_ANON_KEY,
      Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ p_link_id: id }),
  })
    .then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    })
    .then(function (rows) {
      if (!rows || rows.length === 0 || !rows[0].work) {
        showMessage("この作品は見つかりませんでした(公開されていないか、ID が間違っている可能性があります)。");
        return;
      }
      render(rows[0].work, rows[0].chain, rows[0].images);
    })
    .catch(function (e) {
      showMessage("読み込みに失敗しました。時間をおいて、もう一度お試しください。");
    });
})();
</script>
</body>
</html>
